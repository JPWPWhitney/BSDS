[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bsds-backend"
version = "0.1.0"
description = "BSDS Mission Lab backend: Modal app running Basilisk scenarios in sandboxes"
requires-python = ">=3.10"
dependencies = [
    "modal>=1.0",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["bsds_backend*"]
